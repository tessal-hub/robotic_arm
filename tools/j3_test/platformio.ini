[env:j3-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=0
  -Wall
build_unflags = -std=gnu++11
lib_deps =
  teemuatlut/TMCStepper @ ^0.7.3
